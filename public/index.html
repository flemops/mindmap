<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mindmap</title>
<meta name="description" content="Mindmap fractale a navigation spatiale : chaque note contient ses propres notes, posees sur un globe.">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<h1 class="hors-ecran">Mindmap</h1>

<div id="scene"></div>

<aside id="panneau-note" class="panneau" hidden aria-live="polite">
  <div class="panneau-tete">
    <span class="hud-titre">NOTE</span>
    <button id="bouton-fermer-note" aria-label="Revenir a la vue d'ensemble">&times;</button>
  </div>
  <h2 id="titre-note"></h2>
  <p id="contenu-note"></p>
  <div class="hud-ligne">
    <span id="compteur-notes" class="hud-compte"></span>
    <button id="bouton-remonter" hidden>&larr; remonter</button>
  </div>
</aside>

<div id="fil-ariane" class="panneau" aria-live="polite"></div>

<div id="astuce" class="panneau" hidden>
  molette : zoom &middot; glisser : orbiter &middot; alt+glisser : deplacer la vue<br>
  clic : ouvrir &middot; clic droit : editer &middot; double-clic : creer &middot; glisser une note : la deplacer
</div>

<form id="panneau-edition" class="panneau" hidden>
  <div class="hud-titre">EDITION</div>
  <input id="champ-titre" type="text" placeholder="Titre" required maxlength="120">
  <textarea id="champ-contenu" placeholder="Contenu"></textarea>
  <div class="rangee-boutons">
    <button type="button" id="bouton-supprimer" class="danger">Supprimer</button>
    <button type="button" id="bouton-annuler">Annuler</button>
    <button type="submit" class="principal">Enregistrer</button>
  </div>
</form>

<script type="module" src="/static/app.js"></script>
</body>
</html>
