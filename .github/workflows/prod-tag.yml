name: Validation + tag prod

on:
  push:
    branches: [master]
    paths-ignore:
      - '.github/**'
      - 'README.md'
      - 'docs/**'
      - 'CLAUDE.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      tag_prod:
        description: "Déplacer le tag prod si la validation passe"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  ci:
    uses: flemops/ci-templates/.github/workflows/valider-et-taguer.yml@9735d856b021e655984c9b9006b35c327662456e  # v1.0.0
    with:
      runtime: node
      version: "22"
      install_cmd: npm ci
      test_cmd: npm test
      # == true, pas juste inputs.tag_prod : sur un déclenchement push,
      # inputs.tag_prod vaut null, pas false — invaliderait tout le fichier.
      tag_prod: ${{ inputs.tag_prod == true }}
